name: 'Build and Scan'

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# One in-flight run per branch/PR; a newer push cancels the older run.
concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: the build only needs to read the repo.
permissions:
  contents: read

jobs:
  gradle:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: current
    steps:
      - name: 'Checkout current source'
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          path: current
          clean: true
          persist-credentials: false

      - uses: actions/setup-java@main
        with:
          distribution: jetbrains
          java-version: 21

      # Replaces the deprecated gradle/gradle-build-action; adds dependency caching + a build report.
      - name: 'Setup Gradle'
        uses: gradle/actions/setup-gradle@main

      # Full coverage: unit (`test`) + integration (`integrationTest`) + spotlessCheck + kover, all
      # via `build`. The `integration.core.*` org tests skip-loud (no creds on CI); the live
      # external-API tests are retried (see the test-retry config in build.gradle.kts). CI=true is
      # set by GitHub Actions, which is what flips retries on.
      - name: 'Gradle build'
        run: ./gradlew build

      # Structural harness checks only: this exports the current checkout explicitly and validates
      # the installed driver against it. No timing or memory threshold is evaluated in ordinary CI.
      - name: 'Export current benchmark target'
        run: >-
          ./gradlew
          -I benchmark-driver/src/main/dist/libexec/benchmark-target.init.gradle.kts
          writeBenchmarkTargetManifest
          -Pbenchmark.targetManifest=build/benchmark-target-current.json
          -Pbenchmark.targetId=current-cs2a

      - name: 'Checkout fixed baseline source'
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: 83f3cd70f78ad733412d10cbc8287aaabafe7aac
          path: baseline
          clean: true
          persist-credentials: false

      - name: 'Export fixed baseline benchmark target'
        run: >-
          $GITHUB_WORKSPACE/baseline/gradlew
          -p $GITHUB_WORKSPACE/baseline
          -I $GITHUB_WORKSPACE/current/benchmark-driver/src/main/dist/libexec/benchmark-target.init.gradle.kts
          clean writeBenchmarkTargetManifest
          -Pbenchmark.targetManifest=$GITHUB_WORKSPACE/current/build/benchmark-target-baseline-selftest.json
          -Pbenchmark.targetId=baseline-selftest-83f3cd70
          --no-daemon
          --console=plain

      - name: 'Benchmark baseline integration and harness self-test'
        run: >-
          ./gradlew
          :benchmark-driver:check
          :benchmark-driver:integrationTest
          :benchmark-driver:benchmarkCleanInstallTaskGraphTest
          :benchmark-driver:benchmarkJmhTaskSerializationTest
          :benchmark-driver:benchmarkHarnessSelfTest
          -Pbenchmark.targetManifest=build/benchmark-target-baseline-selftest.json
          -Pbenchmark.adapter=baseline-83f3cd70

      - name: 'Benchmark current major lifecycle integration'
        run: >-
          ./gradlew
          :benchmark-driver:integrationTest
          --tests '*RunnerIntegrationTest.real retained worker reports major lifecycle weak references*'
          --tests '*BenchmarkDriverIntegrationTest.major lifecycle retained campaign preserves v2 series identity*'
          -Pbenchmark.targetManifest=build/benchmark-target-current.json
          -Pbenchmark.adapter=major-v1

      # Surface JUnit HTML reports even when the build fails, so a red run is diagnosable.
      - name: 'Upload test reports'
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@main
        with:
          name: test-reports
          path: |
            current/build/reports/tests/
            current/benchmark-driver/build/reports/tests/
          retention-days: 7
          if-no-files-found: ignore
