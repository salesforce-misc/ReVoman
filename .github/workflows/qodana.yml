name: 'Qodana'

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# One in-flight run per branch/PR; a newer push cancels the older run.
concurrency:
  group: qodana-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  pull-request:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: jetbrains
          java-version: 21

      - name: 'Generate sources for analysis'
        run: ./gradlew -q kaptKotlin classes

      - name: 'Verify immutable Qodana image'
        shell: bash
        run: |
          set -euo pipefail
          image='jetbrains/qodana-jvm-community@sha256:f1c5d3efe2f550409c4d95d266c5dc2025a8069d82c9516781eae72e7383b55d'
          case "$(uname -m)" in
            x86_64)
              architecture=amd64
              expected='sha256:6e03fbb417f0f268333ae04d97c4221bdb6bb666a30f0de8b4a34c521e797622'
              ;;
            arm64|aarch64)
              architecture=arm64
              expected='sha256:a8ea6d25700098433060c62818b6172a3ebbf409573353cb7b35b76b07093870'
              ;;
            *)
              exit 1
              ;;
          esac
          actual="$(
            docker buildx imagetools inspect "$image" --raw |
              jq -er --arg architecture "$architecture" \
                '[.manifests[] | select(.platform.os == "linux" and .platform.architecture == $architecture) | .digest] | if length == 1 then .[0] else error("unexpected platform children") end'
          )"
          test "$actual" = "$expected"
          docker pull "$image"

      - name: 'Qodana PR scan'
        uses: JetBrains/qodana-action@4861e015da555e86a72b862892aba6c2b93e6891
        with:
          use-caches: false
          use-annotations: false
          pr-mode: true
          post-pr-comment: false
          github-token: ""
          push-fixes: none
          upload-result: false

      - name: 'Upload Qodana PR report'
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qodana-pr-report
          path: ${{ runner.temp }}/qodana/results
          if-no-files-found: error
          retention-days: 7

  trusted-master:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: jetbrains
          java-version: 21

      - name: 'Generate sources for analysis'
        run: ./gradlew -q kaptKotlin classes

      - name: 'Verify immutable Qodana image'
        shell: bash
        run: |
          set -euo pipefail
          image='jetbrains/qodana-jvm-community@sha256:f1c5d3efe2f550409c4d95d266c5dc2025a8069d82c9516781eae72e7383b55d'
          case "$(uname -m)" in
            x86_64)
              architecture=amd64
              expected='sha256:6e03fbb417f0f268333ae04d97c4221bdb6bb666a30f0de8b4a34c521e797622'
              ;;
            arm64|aarch64)
              architecture=arm64
              expected='sha256:a8ea6d25700098433060c62818b6172a3ebbf409573353cb7b35b76b07093870'
              ;;
            *)
              exit 1
              ;;
          esac
          actual="$(
            docker buildx imagetools inspect "$image" --raw |
              jq -er --arg architecture "$architecture" \
                '[.manifests[] | select(.platform.os == "linux" and .platform.architecture == $architecture) | .digest] | if length == 1 then .[0] else error("unexpected platform children") end'
          )"
          test "$actual" = "$expected"
          docker pull "$image"

      - name: 'Qodana trusted master scan'
        uses: JetBrains/qodana-action@4861e015da555e86a72b862892aba6c2b93e6891
        env:
          QODANA_TOKEN: ${{ secrets.QODANA_TOKEN }}
        with:
          use-caches: false
          use-annotations: false
          pr-mode: false
          post-pr-comment: false
          github-token: ""
          push-fixes: none
          upload-result: false

      - name: 'Upload SARIF to code scanning'
        if: always()
        uses: github/codeql-action/upload-sarif@f3712979fa5f215279b101dd0a2e3bdfb4353324
        with:
          sarif_file: ${{ runner.temp }}/qodana/results/qodana.sarif.json
